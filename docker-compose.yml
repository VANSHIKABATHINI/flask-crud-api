services:
  app:
    build: .
    ports:
      - "4000:4000"
    environment:
      DB_URL: postgresql://postgres:postgres@db:5432/flaskdb
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flaskdb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flaskdb"]
      interval: 5s
      timeout: 5s
      retries: 5